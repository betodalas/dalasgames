<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />

    <!-- PWA: ícone na tela inicial -->
    <link rel="icon" href="%PUBLIC_URL%/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-192.png" />

    <!-- PWA: viewport e tema -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#c9a84c" />
    <meta name="background-color" content="#060809" />

    <!-- PWA: tela cheia no iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dalas Games" />

    <!-- PWA: tela cheia no Android -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SEO / compartilhamento -->
    <meta name="description" content="Jogo de cartas multiplayer online — Dalas Games" />

    <!-- PWA manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Dalas Games — Card Battle</title>

    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
        background: #060809;
      }

      #rotate-msg { display: none; }

      @media screen and (orientation: portrait) and (max-width: 900px) {
        #rotate-msg {
          display: flex;
          position: fixed;
          inset: 0;
          background: #060809;
          color: #c9a84c;
          font-family: serif;
          font-size: 22px;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          z-index: 99999;
        }
        #root { display: none; }
      }
    </style>
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para jogar.</noscript>

    <!-- Mensagem para girar o celular -->
    <div id="rotate-msg">
      <div style="font-size:48px">📱➡️</div>
      <div>Gire o celular para jogar</div>
      <div style="font-size:14px;color:#8a6a2a">O jogo funciona em modo paisagem</div>
    </div>

    <div id="root"></div>

    <!-- PWA: registra service worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/service-worker.js')
            .then(reg => console.log('✅ PWA ativo'))
            .catch(err => console.log('SW erro:', err));
        });
      }
    </script>
  </body>
</html>
